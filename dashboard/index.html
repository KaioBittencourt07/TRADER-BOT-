<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WILL TRADER</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#151d33;border:1px solid #283451;border-radius:14px;padding:16px}.value{font-size:26px;font-weight:700;margin-top:8px}.status{font-weight:700}.meta{color:#9eabc5;font-size:13px}.wide{grid-column:1/-1}button{padding:12px 18px;border:0;border-radius:10px;margin-right:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.online{color:#55d98a}.offline{color:#ff7676}</style></head>
<body><main class="wrap"><h1>WILL TRADER</h1><p class="meta">Painel operacional • modo PAPER • <span id="system">CHECK</span></p><section class="grid"><div class="card"><div class="meta">ATIVO</div><div id="asset" class="value">—</div></div><div class="card"><div class="meta">DECISÃO</div><div id="direction" class="value">WAIT</div></div><div class="card"><div class="meta">HORÁRIO DO CLIQUE</div><div id="clickTime" class="value">—</div></div><div class="card"><div class="meta">CONFIANÇA</div><div id="confidence" class="value">0%</div></div><div class="card"><div class="meta">REGIME</div><div id="regime" class="value">—</div></div><div class="card"><div class="meta">SETUP</div><div id="setup" class="value">—</div></div><div class="card"><div class="meta">RISCO</div><div id="risk" class="value">BLOCKED</div></div><div class="card wide"><div class="meta">MOTIVO</div><p id="reason">Aguardando sinal do WILL.</p><button id="buy" disabled>BUY</button><button id="sell" disabled>SELL</button></div></section></main><script>
const state={direction:'WAIT',blocked:true,confidence:0,clickTime:null};
function render(s=state){
 for(const [id,value] of Object.entries({asset:s.asset??'—',direction:s.direction??'WAIT',clickTime:s.clickTime?new Date(s.clickTime).toLocaleTimeString('pt-BR'):'—',confidence:`${s.confidence??0}%`,regime:s.regime??'—',setup:s.setup??'—',risk:s.blocked?'BLOCKED':'READY',reason:s.reason??'Aguardando sinal.'})) document.getElementById(id).textContent=value;
 document.getElementById('buy').disabled=Boolean(s.blocked)||s.direction!=='BUY';document.getElementById('sell').disabled=Boolean(s.blocked)||s.direction!=='SELL';
}
async function checkHealth(){try{const r=await fetch('/health',{cache:'no-store'});if(!r.ok)throw new Error();document.getElementById('system').textContent='ONLINE';document.getElementById('system').className='online'}catch{document.getElementById('system').textContent='OFFLINE';document.getElementById('system').className='offline'}}
window.setWillSignal=(signal)=>{Object.assign(state,signal);render(state)};
render();checkHealth();setInterval(checkHealth,5000);
</script></body></html>
