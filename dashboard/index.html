<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WILL TRADER</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#151d33;border:1px solid #283451;border-radius:14px;padding:16px}.value{font-size:26px;font-weight:700;margin-top:8px}.meta{color:#9eabc5;font-size:13px}.wide{grid-column:1/-1}button{padding:12px 18px;border:0;border-radius:10px;margin-right:8px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.online{color:#55d98a}.offline{color:#ff7676}.ready{color:#55d98a}.wait{color:#ffd166}.expired{color:#ff7676}</style></head>
<body><main class="wrap"><h1>WILL TRADER</h1><p class="meta">Painel operacional • modo PAPER • <span id="system">CHECK</span></p><section class="grid"><div class="card"><div class="meta">ATIVO</div><div id="asset" class="value">—</div></div><div class="card"><div class="meta">DECISÃO</div><div id="direction" class="value">WAIT</div></div><div class="card"><div class="meta">HORÁRIO DO CLIQUE</div><div id="clickTime" class="value">—</div></div><div class="card"><div class="meta">CONTAGEM</div><div id="countdown" class="value">—</div></div><div class="card"><div class="meta">EXPIRAÇÃO</div><div id="expiryTime" class="value">—</div></div><div class="card"><div class="meta">CONFIANÇA</div><div id="confidence" class="value">0%</div></div><div class="card"><div class="meta">DADOS</div><div id="dataAge" class="value">—</div></div><div class="card"><div class="meta">STATUS TIMING</div><div id="timingStatus" class="value">WAIT</div></div><div class="card wide"><div class="meta">MOTIVO</div><p id="reason">Aguardando feed de mercado.</p><button id="analyze" disabled>ANALISAR</button></div></section></main><script type="module">
import { getHealth, getMarketSnapshot, analyzeMarket } from './api.js';
const params=new URLSearchParams(location.search);const asset=params.get('asset')||'EUR/USD';const timeframe=params.get('timeframe')||'1min';
const state={direction:'WAIT',blocked:true,confidence:0,clickTime:null,timing:null};let marketSnapshot=null;let loading=false;
const fmt=t=>t?new Date(t).toLocaleTimeString('pt-BR',{hour12:false}):'—';
function render(s=state){const timing=s.timing;const fields={asset:s.asset??marketSnapshot?.asset??'—',direction:s.direction??'WAIT',clickTime:fmt(s.clickTime),countdown:'—',expiryTime:fmt(timing?.expiryTime),confidence:`${s.confidence??0}%`,dataAge:marketSnapshot?`${Math.max(0,Math.round(marketSnapshot.ageMs/1000))}s`:'—',timingStatus:timing?'AGUARDANDO':'WAIT',reason:s.reason??'Aguardando feed de mercado.'};for(const[id,value]of Object.entries(fields))document.getElementById(id).textContent=value;document.getElementById('analyze').disabled=!marketSnapshot||!marketSnapshot.valid||loading}
function tick(){const el=document.getElementById('countdown');if(!state.timing||state.direction==='WAIT'){el.textContent='—';return}const now=Date.now(),click=Date.parse(state.timing.clickTime),until=Date.parse(state.timing.validUntil);if(now<click){el.textContent=`${Math.ceil((click-now)/1000)}s`;return}if(now<=until){el.textContent='AGORA';document.getElementById('timingStatus').textContent='JANELA ABERTA';return}el.textContent='EXPIRADO';document.getElementById('timingStatus').textContent='EXPIRADO';}
async function checkHealth(){try{const r=await getHealth();document.getElementById('system').textContent=r.marketConfigured?'ONLINE • FEED':'ONLINE • SEM FEED';document.getElementById('system').className=r.marketConfigured?'online':'offline'}catch{document.getElementById('system').textContent='OFFLINE';document.getElementById('system').className='offline'}}
async function refreshMarket(){try{const r=await getMarketSnapshot(asset,timeframe);if(!r.ok||!r.snapshot?.valid)throw new Error(r.snapshot?.reason||'Feed inválido');marketSnapshot=r.snapshot;Object.assign(state,{asset:marketSnapshot.asset,direction:'WAIT',blocked:true,confidence:0,clickTime:null,timing:null,reason:'Dados reais recebidos. Pronto para análise.'});render()}catch(error){marketSnapshot=null;Object.assign(state,{direction:'WAIT',blocked:true,confidence:0,clickTime:null,timing:null,reason:`Feed: ${error.message}`});render()}}
document.getElementById('analyze').onclick=async()=>{if(!marketSnapshot||loading)return;loading=true;Object.assign(state,{analyzing:true,reason:'WILL analisando snapshot real...'});render();try{const result=await analyzeMarket(marketSnapshot,{dataValid:true,executionDelayMs:0,windowBeforeMs:2000,windowAfterMs:3000,expirySeconds:60});Object.assign(state,result?.decision??result,{analyzing:false});if(state.direction!=='BUY'&&state.direction!=='SELL'){state.blocked=true;state.clickTime=null;state.timing=null}render()}catch(error){Object.assign(state,{direction:'WAIT',blocked:true,confidence:0,clickTime:null,timing:null,analyzing:false,reason:error.message});render()}finally{loading=false;render()}};render();checkHealth();refreshMarket();setInterval(checkHealth,5000);setInterval(refreshMarket,10000);setInterval(tick,250);
</script></body></html>
